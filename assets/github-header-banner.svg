<svg width="1500" height="500" xmlns="http://www.w3.org/2000/svg" xmlns:xlink="http://www.w3.org/1999/xlink">
  <!-- Definitions for gradients, filters and animations -->
  <defs>
    <!-- Modern professional gradient with deep blue tones -->
    <linearGradient id="bgGradient" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" style="stop-color:#0A192F;stop-opacity:1" />
      <stop offset="50%" style="stop-color:#112240;stop-opacity:1" />
      <stop offset="100%" style="stop-color:#1A365D;stop-opacity:1" />
    </linearGradient>
    
    <!-- Refined accent gradient for highlights -->
    <linearGradient id="accentGradient" x1="0%" y1="0%" x2="100%" y2="0%">
      <stop offset="0%" style="stop-color:#64FFDA;stop-opacity:1" />
      <stop offset="100%" style="stop-color:#00B5D8;stop-opacity:1" />
    </linearGradient>
    
    <!-- Subtle text shadow for better readability -->
    <filter id="textShadow" x="-10%" y="-10%" width="120%" height="120%">
      <feDropShadow dx="0" dy="2" stdDeviation="2" flood-color="#000" flood-opacity="0.3" />
    </filter>
    
    <!-- Enhanced glow effect for tech elements -->
    <filter id="glow" x="-20%" y="-20%" width="140%" height="140%">
      <feGaussianBlur stdDeviation="4" result="blur" />
      <feComposite in="SourceGraphic" in2="blur" operator="over" />
    </filter>
    
    <!-- Improved circuit pattern for background -->
    <pattern id="circuitPattern" x="0" y="0" width="100" height="100" patternUnits="userSpaceOnUse">
      <path d="M10 10 L90 10 L90 90 L10 90 Z" fill="none" stroke="#ffffff" stroke-width="0.5" stroke-opacity="0.07" />
      <circle cx="10" cy="10" r="2" fill="#ffffff" fill-opacity="0.12" />
      <circle cx="90" cy="10" r="2" fill="#ffffff" fill-opacity="0.12" />
      <circle cx="90" cy="90" r="2" fill="#ffffff" fill-opacity="0.12" />
      <circle cx="10" cy="90" r="2" fill="#ffffff" fill-opacity="0.12" />
      <path d="M10 50 L50 50 L50 90" fill="none" stroke="#ffffff" stroke-width="0.7" stroke-opacity="0.07" />
      <path d="M90 50 L50 50 L50 10" fill="none" stroke="#ffffff" stroke-width="0.7" stroke-opacity="0.07" />
      <path d="M30 10 L30 30 L50 30" fill="none" stroke="#ffffff" stroke-width="0.5" stroke-opacity="0.07" />
      <path d="M70 90 L70 70 L50 70" fill="none" stroke="#ffffff" stroke-width="0.5" stroke-opacity="0.07" />
      <circle cx="50" cy="50" r="3" fill="#64FFDA" fill-opacity="0.15" />
    </pattern>
    
    <!-- Subtle grid overlay -->
    <pattern id="gridOverlay" x="0" y="0" width="50" height="50" patternUnits="userSpaceOnUse">
      <rect width="50" height="50" fill="none" stroke="#ffffff" stroke-width="0.3" stroke-opacity="0.03" />
    </pattern>
    
    <!-- Animations -->
    <animate id="fadeIn" attributeName="opacity" from="0" to="1" dur="1s" begin="0s" fill="freeze" />
    
    <!-- Pulse animation for icons -->
    <animate id="pulse" attributeName="opacity" values="0.7;1;0.7" dur="3s" repeatCount="indefinite" />
  </defs>
  
  <!-- Main background with professional gradient -->
  <rect width="1500" height="500" fill="url(#bgGradient)" rx="10" ry="10" />
  
  <!-- Circuit pattern overlay -->
  <rect width="1500" height="500" fill="url(#circuitPattern)" rx="10" ry="10" />
  
  <!-- Grid overlay for added depth -->
  <rect width="1500" height="500" fill="url(#gridOverlay)" rx="10" ry="10" />
  
  <!-- Subtle accent border -->
  <rect width="1496" height="496" x="2" y="2" rx="8" ry="8" fill="none" stroke="url(#accentGradient)" stroke-width="1" stroke-opacity="0.3" />
  
  <!-- Decorative tech elements -->
  <g id="decorElements">
    <!-- Animated circles representing connectivity -->
    <circle cx="150" cy="100" r="40" fill="url(#accentGradient)" fill-opacity="0.1">
      <animate attributeName="r" values="40;45;40" dur="4s" repeatCount="indefinite" />
    </circle>
    <circle cx="1350" cy="400" r="60" fill="url(#accentGradient)" fill-opacity="0.1">
      <animate attributeName="r" values="60;65;60" dur="5s" repeatCount="indefinite" />
    </circle>
    <circle cx="1200" cy="150" r="30" fill="#ffffff" fill-opacity="0.1">
      <animate attributeName="r" values="30;35;30" dur="3s" repeatCount="indefinite" />
    </circle>
    <circle cx="300" cy="400" r="50" fill="#ffffff" fill-opacity="0.1">
      <animate attributeName="r" values="50;55;50" dur="6s" repeatCount="indefinite" />
    </circle>
    
    <!-- Code elements representing development with improved styling -->
    <g opacity="0.2">
      <text x="100" y="250" font-family="monospace" font-size="80" fill="url(#accentGradient)">&lt;/&gt;</text>
      <text x="1350" y="250" font-family="monospace" font-size="80" fill="url(#accentGradient)">&lt;/&gt;</text>
      <text x="200" y="350" font-family="monospace" font-size="60" fill="#ffffff">{}</text>
      <text x="1250" y="150" font-family="monospace" font-size="60" fill="#ffffff">()</text>
    </g>
    
    <!-- Abstract code lines -->
    <g opacity="0.1">
      <path d="M50 450 L150 450" stroke="#64FFDA" stroke-width="2" />
      <path d="M160 450 L220 450" stroke="#64FFDA" stroke-width="2" />
      <path d="M230 450 L280 450" stroke="#ffffff" stroke-width="2" />
      
      <path d="M1300 100 L1400 100" stroke="#64FFDA" stroke-width="2" />
      <path d="M1250 100 L1290 100" stroke="#ffffff" stroke-width="2" />
      <path d="M1200 100 L1240 100" stroke="#64FFDA" stroke-width="2" />
    </g>
  </g>
  
  <!-- Main content container -->
  <g id="mainContent">
    <!-- Name with modern typography -->
    <text x="750" y="200" font-family="'Segoe UI', Arial, sans-serif" font-size="70" font-weight="bold" text-anchor="middle" fill="#ffffff" filter="url(#textShadow)">
      MD. Razikul Islam Joni
      <animate attributeName="opacity" from="0" to="1" dur="1s" begin="0s" fill="freeze" />
    </text>
    
    <!-- Professional title with accent color -->
    <text x="750" y="250" font-family="'Segoe UI', Arial, sans-serif" font-size="40" text-anchor="middle" fill="url(#accentGradient)" filter="url(#textShadow)">
      Frontend Developer | MERN Stack | React Specialist 
      <animate attributeName="opacity" from="0" to="1" dur="1s" begin="0.3s" fill="freeze" />
      <tspan x="750" dy="50">Learner | IoT/Tech Enthusiast | Explorer</tspan>
    </text>
  </g>
  
  <!-- Tech stack icons with animations -->
  <g id="techIcons" transform="translate(450, 350)">
    <!-- React icon (animated) -->
    <g transform="translate(0, 0)" filter="url(#glow)">
      <circle cx="0" cy="0" r="25" fill="#61DAFB" fill-opacity="0.2" />
      <circle cx="0" cy="0" r="5" fill="#61DAFB" />
      <ellipse cx="0" cy="0" rx="25" ry="10" fill="none" stroke="#61DAFB" stroke-width="2" transform="rotate(30)" />
      <ellipse cx="0" cy="0" rx="25" ry="10" fill="none" stroke="#61DAFB" stroke-width="2" transform="rotate(90)" />
      <ellipse cx="0" cy="0" rx="25" ry="10" fill="none" stroke="#61DAFB" stroke-width="2" transform="rotate(150)" />
      <animate attributeName="opacity" from="0" to="1" dur="1s" begin="0.5s" fill="freeze" />
      <animateTransform attributeName="transform" type="rotate" from="0 0 0" to="360 0 0" dur="20s" repeatCount="indefinite" />
    </g>
    
    <!-- Node.js icon -->
    <g transform="translate(100, 0)" filter="url(#glow)">
      <path d="M-15,-15 L15,-15 L25,0 L15,15 L-15,15 L-25,0 Z" fill="#8CC84B" fill-opacity="0.9" />
      <animate attributeName="opacity" from="0" to="1" dur="1s" begin="0.6s" fill="freeze" />
    </g>
    
    <!-- MongoDB icon -->
    <g transform="translate(200, 0)" filter="url(#glow)">
      <path d="M0,-20 C10,-20 20,-10 20,0 C20,15 0,25 0,25 C0,25 -20,15 -20,0 C-20,-10 -10,-20 0,-20 Z" fill="#4DB33D" fill-opacity="0.9" />
      <animate attributeName="opacity" from="0" to="1" dur="1s" begin="0.7s" fill="freeze" />
    </g>
    
    <!-- Next.js icon -->
    <g transform="translate(300, 0)" filter="url(#glow)">
      <circle cx="0" cy="0" r="20" fill="#000000" fill-opacity="0.9" />
      <text x="0" y="7" font-family="Arial, sans-serif" font-size="24" font-weight="bold" text-anchor="middle" fill="#ffffff">N</text>
      <animate attributeName="opacity" from="0" to="1" dur="1s" begin="0.8s" fill="freeze" />
    </g>
    
    <!-- IoT/Arduino icon -->
    <g transform="translate(400, 0)" filter="url(#glow)">
      <rect x="-20" y="-15" width="40" height="30" rx="5" ry="5" fill="#00979D" fill-opacity="0.9" />
      <circle cx="-10" cy="-5" r="3" fill="#ffffff" />
      <circle cx="0" cy="-5" r="3" fill="#ffffff" />
      <circle cx="10" cy="-5" r="3" fill="#ffffff" />
      <rect x="-15" y="5" width="30" height="5" fill="#ffffff" />
      <animate attributeName="opacity" from="0" to="1" dur="1s" begin="0.9s" fill="freeze" />
    </g>
    
    <!-- Tailwind CSS icon -->
    <g transform="translate(500, 0)" filter="url(#glow)">
      <path d="M-20,-10 C-10,-20 10,-20 20,-10 C10,0 -10,0 -20,-10 Z M-20,10 C-10,0 10,0 20,10 C10,20 -10,20 -20,10 Z" fill="#38B2AC" fill-opacity="0.9" />
      <animate attributeName="opacity" from="0" to="1" dur="1s" begin="1s" fill="freeze" />
    </g>
  </g>
  
  <!-- Professional badge -->
  <!-- <g transform="translate(1400, 50)">
    <rect x="-60" y="-20" width="120" height="40" rx="20" ry="20" fill="url(#accentGradient)" fill-opacity="0.2" stroke="#64FFDA" stroke-width="1" stroke-opacity="0.5" />
    <text x="0" y="5" font-family="'Segoe UI', Arial, sans-serif" font-size="14" font-weight="500" text-anchor="middle" fill="#ffffff">PROFESSIONAL</text>
    <animate attributeName="opacity" from="0" to="1" dur="1s" begin="1.2s" fill="freeze" />
  </g> -->
</svg>